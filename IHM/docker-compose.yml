services:
  mongodb:
    image: mongo:7
    container_name: autoboat-mongo
    restart: unless-stopped
    ports:
      # Lié à loopback uniquement : sans auth, "27017:27017" exposait Mongo
      # (télémétrie + commandes bateau) à tout le LAN. Décision de déploiement
      # volontairement pas prise ici : pas d'identifiants ajoutés, juste
      # suppression de l'exposition par défaut.
      - "127.0.0.1:27017:27017"
    volumes:
      - autoboat-mongo-data:/data/db

volumes:
  autoboat-mongo-data:
